<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metric Clarity Mockup · Mailchimp</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@font-face { font-family: 'Graphik Mailchimp'; src: url('fonts/GraphikMailchimp-Regular-Web.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Graphik Mailchimp'; src: url('fonts/GraphikMailchimp-Medium-Web.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Graphik Mailchimp'; src: url('fonts/GraphikMailchimp-Semibold-Web.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Graphik Mailchimp'; src: url('fonts/GraphikMailchimp-Bold-Web.woff2') format('woff2'); font-weight: 700; }
:root {
  --elderberry-130:#171b1f; --elderberry-100:#6e7173; --elderberry-90:#8b8d8f; --elderberry-80:#9ea0a2; --elderberry-70:#b2b3b4; --elderberry-50:#d8d9da; --elderberry-40:#ececec; --elderberry-30:#f3f3f3; --elderberry-20:#f8f8f8;
  --kale-100:#045c67; --kale-90:#007c89; --kale-30:#c2e0e3; --kale-10:#e5f2f3; --kale-0:#f5fafa;
  --blueberry-70:#2b77cc; --blueberry-10:#e0edff;
  --kiwi-80:#00892e; --kiwi-40:#a8edba; --kiwi-10:#d2f8d9;
  --watermelon-80:#b61a37; --watermelon-10:#ffe7e7;
  --persimmon-60:#e56c1d; --persimmon-10:#ffe6d4;
  --eggplant-70:#a275ff; --eggplant-50:#c2a3ff; --eggplant-10:#f0e8ff;
  --cavendish:#ffe01b; --coconut:#ffffff;
  --font:'Graphik Mailchimp',Helvetica,Arial,sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; color: var(--elderberry-130); background: var(--elderberry-20); min-height: 100vh; }

/* App header */
.app-header { height: 52px; background: var(--elderberry-130); display: flex; align-items: center; padding: 0 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 200; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); text-decoration: none; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 4px; background: rgba(255,255,255,.08); margin-right: 12px; }
.back-link:hover { background: rgba(255,255,255,.15); }
.logo-mark { width: 28px; height: 28px; }
.app-search { flex: 1; max-width: 480px; margin: 0 24px; height: 32px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 4px; display: flex; align-items: center; padding: 0 10px; color: rgba(255,255,255,.45); font-size: 12px; }
.app-right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.75); font-size: 12px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--watermelon-80); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }

.layout { display: flex; padding-top: 52px; min-height: calc(100vh - 52px); }
.sidebar { width: 216px; background: var(--elderberry-130); position: fixed; top: 52px; bottom: 0; overflow-y: auto; padding: 12px 0; }
.btn-create { margin: 0 12px 8px; height: 36px; background: var(--cavendish); color: var(--elderberry-130); border: none; border-radius: 4px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 24px); font-family: var(--font); }
.nav-group { padding: 4px 0; }
.nav-group + .nav-group { border-top: 1px solid rgba(255,255,255,.08); }
.nav-section-label { padding: 12px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.5); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font-size: 13px; color: var(--elderberry-70); text-decoration: none; cursor: pointer; position: relative; }
.nav-item:hover { background: rgba(255,255,255,.08); color: white; }
.nav-item.active { background: rgba(255,255,255,.12); color: var(--cavendish); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--cavendish); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-sub-item { padding-left: 42px; font-size: 12px; }

.main { flex: 1; margin-left: 216px; min-width: 0; transition: margin-right .2s; }
.main.with-rail { margin-right: 380px; }

.page-header { background: white; border-bottom: 1px solid var(--elderberry-40); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 52px; z-index: 50; min-height: 60px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.page-title-row { display: flex; align-items: center; gap: 12px; }
.audience-pill { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 12px; background: var(--elderberry-30); border: 1px solid var(--elderberry-50); border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn-ghost { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; background: transparent; border: 1px solid var(--elderberry-50); border-radius: 4px; font-size: 12px; color: var(--elderberry-100); cursor: pointer; font-family: var(--font); }
.btn-ghost:hover { background: var(--elderberry-30); }
.btn-primary { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; background: var(--kale-90); color: white; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.btn-primary:hover { background: var(--kale-100); }
.btn-secondary { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; background: white; color: var(--kale-90); border: 1px solid var(--kale-90); border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); }

.page-content { padding: 24px 32px; }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi-tile { background: white; border: 1px solid var(--elderberry-40); border-radius: 8px; padding: 14px; position: relative; }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--elderberry-90); display: flex; align-items: center; gap: 4px; }
.kpi-value { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
.kpi-delta { font-size: 11px; font-weight: 600; margin-top: 4px; }
.kpi-delta.up { color: var(--kiwi-80); }
.kpi-delta.down { color: var(--watermelon-80); }

.widget { background: white; border: 1px solid var(--elderberry-40); border-radius: 8px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.widget-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.widget-sub { font-size: 12px; color: var(--elderberry-100); margin-top: 2px; }

.filters-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.filter-pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; background: white; border: 1px solid var(--elderberry-50); border-radius: 4px; font-size: 12px; font-family: var(--font); cursor: pointer; }
.filter-pill strong { font-weight: 600; }

/* Info icon */
.info-i { width: 14px; height: 14px; border-radius: 50%; background: var(--elderberry-50); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-style: italic; cursor: pointer; flex-shrink: 0; transition: background .15s; vertical-align: middle; }
.info-i:hover { background: var(--kale-90); }
.info-i.lit { background: var(--kale-90); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,124,137,.4);} 50% { box-shadow: 0 0 0 6px rgba(0,124,137,0);} }

/* Tooltip */
.tooltip {
  position: absolute;
  background: white;
  border: 1px solid var(--elderberry-40);
  border-radius: 8px;
  padding: 16px;
  box-shadow: 0 12px 28px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.06);
  width: 320px;
  z-index: 30;
  font-size: 12px;
}
.tooltip::before { content: ''; position: absolute; top: -7px; left: 24px; width: 12px; height: 12px; background: white; border-left: 1px solid var(--elderberry-40); border-top: 1px solid var(--elderberry-40); transform: rotate(45deg); }
.tooltip-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--kale-90); margin-bottom: 4px; }
.tooltip-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.tooltip-def { font-size: 12px; color: var(--elderberry-100); line-height: 1.5; margin-bottom: 12px; }
.tooltip-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--elderberry-30); font-size: 11px; }
.tooltip-row .l { color: var(--elderberry-100); }
.tooltip-row .v { font-weight: 700; }
.tooltip-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--kale-90); margin-top: 12px; text-decoration: none; }
.tooltip-link:hover { text-decoration: underline; }

/* Precision asterisk */
.prec-asterisk { color: var(--persimmon-60); font-weight: 700; cursor: pointer; margin-left: 2px; }
.prec-note { font-size: 11px; color: var(--persimmon-60); font-weight: 500; margin-top: 2px; display: flex; align-items: center; gap: 4px; }

/* AI elements */
.ai-pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px;
  background: linear-gradient(135deg, var(--kale-90), #006470);
  color: white;
  border: none;
  border-radius: 100px;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  box-shadow: 0 2px 6px rgba(0,124,137,.3);
}
.ai-pill:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,124,137,.4); }
.ai-pill.eggplant { background: linear-gradient(135deg, var(--eggplant-70), #6f4cd6); box-shadow: 0 2px 6px rgba(162,117,255,.3); }

.ai-pill-tile {
  position: absolute; top: 8px; right: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px;
  background: white;
  border: 1px solid var(--kale-30);
  color: var(--kale-100);
  border-radius: 100px;
  font-size: 10px; font-weight: 600;
  cursor: pointer;
  opacity: 0; transition: opacity .15s;
}
.kpi-tile:hover .ai-pill-tile { opacity: 1; }

.looks-wrong-btn {
  position: absolute; top: 6px; right: 6px;
  height: 22px; padding: 0 8px;
  background: white;
  border: 1px solid var(--kale-30);
  color: var(--kale-100);
  border-radius: 100px;
  font-size: 10px; font-weight: 600;
  cursor: pointer;
  opacity: 0; transition: opacity .15s;
  display: inline-flex; align-items: center; gap: 4px;
}
.kpi-tile:hover .looks-wrong-btn { opacity: 1; }

/* Right rail */
.ai-rail {
  position: fixed; top: 52px; right: 0; bottom: 0;
  width: 380px;
  background: white;
  border-left: 1px solid var(--elderberry-40);
  display: flex; flex-direction: column;
  z-index: 90;
  box-shadow: -4px 0 16px rgba(0,0,0,.04);
}
.ai-rail-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--elderberry-40);
  display: flex; align-items: center; gap: 10px;
}
.ai-rail-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--eggplant-70), var(--blueberry-70));
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700;
  flex-shrink: 0;
}
.ai-rail-title { font-size: 14px; font-weight: 700; }
.ai-rail-sub { font-size: 11px; color: var(--elderberry-100); margin-top: 1px; }
.ai-rail-close { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; cursor: pointer; color: var(--elderberry-100); font-size: 16px; }
.ai-rail-close:hover { background: var(--elderberry-30); }
.ai-rail-body { flex: 1; overflow-y: auto; padding: 18px; }
.ai-msg-context {
  background: var(--elderberry-20);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 14px;
  font-size: 11px;
  border: 1px solid var(--elderberry-40);
}
.ai-msg-context-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--elderberry-90); margin-bottom: 4px; }
.ai-msg {
  background: linear-gradient(135deg, #fafaff 0%, #f0e8ff 100%);
  border: 1px solid var(--eggplant-10);
  border-radius: 8px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 12px;
}
.ai-msg p { margin-bottom: 10px; }
.ai-msg p:last-child { margin-bottom: 0; }
.ai-msg ul { padding-left: 18px; margin-bottom: 10px; }
.ai-msg ul li { margin-bottom: 4px; }
.ai-msg strong { font-weight: 700; }
.ai-msg .kb-link { color: var(--kale-90); font-weight: 600; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; cursor: pointer; }
.ai-msg .kb-link:hover { color: var(--kale-100); text-decoration-style: solid; }
.ai-citation {
  margin-top: 10px;
  padding: 8px 10px;
  background: white;
  border: 1px solid var(--elderberry-40);
  border-radius: 6px;
  display: flex; gap: 8px; align-items: center;
  font-size: 11px;
  cursor: pointer;
  text-decoration: none; color: inherit;
}
.ai-citation:hover { border-color: var(--kale-90); background: var(--kale-0); }
.ai-cite-icon { width: 24px; height: 24px; border-radius: 4px; background: var(--kale-10); color: var(--kale-90); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.ai-cite-body { flex: 1; min-width: 0; }
.ai-cite-title { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-cite-meta { color: var(--elderberry-90); font-size: 10px; }

.followup-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 0; }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; background: white; border: 1px solid var(--elderberry-50); border-radius: 100px; font-size: 12px; font-family: var(--font); cursor: pointer; color: var(--elderberry-100); }
.chip:hover { background: var(--kale-0); border-color: var(--kale-90); color: var(--kale-100); }

.ai-input-wrap { padding: 12px 18px; border-top: 1px solid var(--elderberry-40); display: flex; gap: 8px; background: var(--elderberry-20); }
.ai-input { flex: 1; height: 36px; border: 1px solid var(--elderberry-50); border-radius: 100px; padding: 0 14px; font-size: 13px; font-family: var(--font); background: white; }
.ai-send { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--kale-90); color: white; cursor: pointer; flex-shrink: 0; }

/* Mockup meta bar */
.mockup-meta-bar { background: var(--elderberry-130); color: white; padding: 12px 32px; position: sticky; top: 52px; z-index: 60; display: flex; align-items: center; gap: 16px; font-size: 12px; border-bottom: 1px solid #2a2e32; }
.mockup-meta-id { background: var(--cavendish); color: var(--elderberry-130); font-weight: 700; padding: 3px 8px; border-radius: 4px; font-size: 11px; letter-spacing: .04em; }
.mockup-meta-id.ai { background: var(--eggplant-70); color: white; }
.mockup-meta-title { font-weight: 600; }
.mockup-meta-tactic { color: rgba(255,255,255,.6); }
.mockup-meta-nav { margin-left: auto; display: flex; gap: 6px; }
.mockup-meta-nav a { background: rgba(255,255,255,.1); color: white; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: 600; }
.mockup-meta-nav a:hover { background: rgba(255,255,255,.2); }

/* Drawer */
.drawer-overlay { position: fixed; top: 52px; left: 216px; right: 0; bottom: 0; background: rgba(0,0,0,.3); z-index: 100; display: none; }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: 480px; background: white; box-shadow: -8px 0 24px rgba(0,0,0,.12); z-index: 101; padding: 24px; overflow-y: auto; transform: translateX(100%); transition: transform .25s; }
.drawer.open { transform: translateX(0); }
.drawer-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--elderberry-40); }
.drawer-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--kale-90); margin-bottom: 4px; }
.drawer-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.drawer-value { font-size: 32px; font-weight: 700; color: var(--kale-100); margin-top: 6px; letter-spacing: -.02em; }
.drawer-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--elderberry-30); cursor: pointer; color: var(--elderberry-100); font-size: 16px; }

.calc-row { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 8px; align-items: center; padding: 16px; background: var(--elderberry-20); border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
.calc-cell { text-align: center; }
.calc-cell .l { font-size: 10px; font-weight: 600; color: var(--elderberry-90); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.calc-cell .v { font-size: 22px; font-weight: 700; }
.calc-op { font-size: 24px; color: var(--elderberry-80); font-weight: 300; }

/* Anomaly */
.anomaly-note {
  display: inline-flex; align-items: flex-start; gap: 6px;
  margin-top: 6px;
  padding: 6px 10px;
  background: linear-gradient(135deg, #faf6ff, #f0e8ff);
  border: 1px solid var(--eggplant-50);
  border-radius: 6px;
  font-size: 11px;
  color: var(--elderberry-130);
  line-height: 1.4;
  max-width: 100%;
}
.anomaly-note .ico { color: var(--eggplant-70); flex-shrink: 0; font-size: 12px; line-height: 1.2; }
.anomaly-note .kb-link { color: var(--eggplant-70); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }

/* Compare */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-col { padding: 16px; border-radius: 8px; border: 1px solid var(--elderberry-40); background: white; }
.compare-col h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.compare-col .num { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0; }
.compare-col.mc { background: linear-gradient(135deg, #fffceb, #fff8d0); border-color: #f0d800; }
.compare-col.ga { background: linear-gradient(135deg, #f4f9ff, #e0edff); border-color: #b8d4f7; }
.scope-list { list-style: none; margin-top: 10px; }
.scope-list li { padding: 6px 0; font-size: 12px; border-top: 1px solid rgba(0,0,0,.06); display: flex; align-items: center; gap: 8px; }
.scope-list li.included::before { content: '✓'; color: var(--kiwi-80); font-weight: 700; }
.scope-list li.excluded::before { content: '✕'; color: var(--watermelon-80); font-weight: 700; }

.reconcile-card { background: linear-gradient(135deg, #faf6ff, #f0e8ff); border: 1px solid var(--eggplant-70); border-radius: 8px; padding: 16px; margin-top: 16px; }
.reconcile-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--eggplant-70); margin-bottom: 6px; }
.reconcile-math { font-size: 13px; line-height: 1.7; font-family: 'SF Mono', Menlo, monospace; background: white; padding: 12px; border-radius: 6px; margin-top: 8px; border: 1px solid #ddd0ff; }

/* Learn rail (mockup 6) */
.learn-rail { position: fixed; top: 52px; right: 0; bottom: 0; width: 380px; background: white; border-left: 1px solid var(--elderberry-40); display: flex; flex-direction: column; z-index: 90; }
.learn-tabs { display: flex; border-bottom: 1px solid var(--elderberry-40); padding: 0 14px; }
.learn-tab { padding: 12px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--elderberry-100); border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); }
.learn-tab.active { color: var(--kale-100); border-bottom-color: var(--kale-100); }
.learn-search { padding: 12px 14px; border-bottom: 1px solid var(--elderberry-40); }
.learn-search input { width: 100%; height: 32px; border: 1px solid var(--elderberry-50); border-radius: 4px; padding: 0 10px 0 30px; font-size: 12px; font-family: var(--font); background: var(--elderberry-20) url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 16 16'%3E%3Ccircle cx='6.5' cy='6.5' r='5.5' stroke='%236e7173' stroke-width='1.5' fill='none'/%3E%3Cline x1='10' y1='10' x2='14' y2='14' stroke='%236e7173' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat 10px center; }
.learn-section { padding: 14px; border-bottom: 1px solid var(--elderberry-40); }
.learn-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--elderberry-90); margin-bottom: 8px; }
.kb-card { padding: 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; }
.kb-card:hover { background: var(--kale-0); }

/* ─────────── REFINED FINALISTS (F1, F2) ─────────── */
.rationale-panel {

  color: white;
  border-radius: 12px;
  padding: 24px 28px;
  margin: 0 32px 24px;

}
.rationale-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--cavendish); color: var(--elderberry-130); padding: 4px 10px; border-radius: 100px; margin-bottom: 14px; }
.rationale-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px; }
.rationale-sub { font-size: 13px; color: rgba(255,255,255,.65); margin-bottom: 18px; line-height: 1.55; }
.rationale-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.rationale-section h4 { font-size: 11px; font-weight: 700; color: var(--cavendish); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.rationale-section ul { list-style: none; padding: 0; margin: 0; }
.rationale-section li { font-size: 13px; line-height: 1.55; margin-bottom: 10px; padding-left: 22px; position: relative; }
.rationale-section li::before { content: ''; position: absolute; left: 0; top: 7px; width: 12px; height: 2px; background: var(--cavendish); border-radius: 2px; }
.rationale-section li strong { color: white; font-weight: 600; }
.rationale-section li code { background: rgba(255,224,27,.15); color: var(--cavendish); padding: 1px 6px; border-radius: 3px; font-size: 11px; font-family: 'SF Mono', Menlo, monospace; }
.rationale-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; background: rgba(255,224,27,.18); color: var(--cavendish); border-radius: 100px; margin-right: 4px; margin-bottom: 4px; }

/* Compact tooltip — used by both F1 & F2 finalists */
.compact-tt {
  position: absolute;
  background: white;
  border: 1px solid var(--elderberry-40);
  border-radius: 10px;
  padding: 0;
  box-shadow: 0 16px 36px rgba(0,0,0,.16), 0 4px 12px rgba(0,0,0,.06);
  width: 340px;
  z-index: 80;
  font-size: 12px;
  overflow: hidden;
}
.compact-tt::before { content: ''; position: absolute; top: -7px; left: 24px; width: 12px; height: 12px; background: white; border-left: 1px solid var(--elderberry-40); border-top: 1px solid var(--elderberry-40); transform: rotate(45deg); }
/* Head — Definition (always visible) */
.ctt-head { padding: 14px 16px 12px; }
.ctt-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--kale-90); margin-bottom: 4px; }
.ctt-title { font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
.ctt-def { font-size: 12px; color: var(--elderberry-100); line-height: 1.5; margin-top: 4px; }

/* Meta rows — Freshness + Source (always visible, consistent format) */
.ctt-meta-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: var(--elderberry-20);
  border-top: 1px solid var(--elderberry-40);
  font-size: 11px;
  color: var(--elderberry-100);
}
.ctt-meta-row:first-of-type { border-top: 1px solid var(--elderberry-40); }
.ctt-meta-icon { font-size: 13px; flex-shrink: 0; }
.ctt-meta-body { line-height: 1.4; }
.ctt-meta-body strong { color: var(--elderberry-130); font-weight: 600; }

/* Accordion toggle — used by both "More details" and "Related articles" */
.ctt-toggle {
  width: 100%; border: none; background: white; cursor: pointer;
  padding: 11px 16px; font-family: var(--font); font-size: 12px; font-weight: 500;
  color: var(--elderberry-130); text-align: left;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--elderberry-40);
}
.ctt-toggle:hover { background: var(--kale-0); }
.ctt-toggle strong { color: var(--kale-100); font-weight: 600; }
.ctt-toggle .chev { color: var(--elderberry-90); transition: transform .15s; flex-shrink: 0; margin-left: 8px; }
.ctt-toggle.open .chev { transform: rotate(180deg); }

.ctt-more { display: none; padding: 0; font-size: 11px; border-top: 1px solid var(--elderberry-40); background: var(--elderberry-20); }
.ctt-more.open { display: block; }

/* Detail rows inside accordion */
.ctt-more-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--elderberry-30);
  align-items: flex-start;

}

.ctt-more-row .v { font-weight: 600; text-align: right; color: var(--elderberry-130); }

.ctt-more-row.bench { background: var(--kiwi-10); }
.ctt-more-row.bench .l { color: var(--kiwi-80); font-weight: 600; }

/* Compare-to-platforms section inside More Details accordion */
.ctt-compare-section { background: white; padding: 10px 16px 12px; border-bottom: 1px solid var(--elderberry-30); }
.ctt-compare-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--kale-90); margin-bottom: 8px; }

.ctt-compare-row .v { font-weight: 700; color: var(--elderberry-130); font-size: 12px; }

.ctt-agent-response .kb-inline { color: var(--kale-90); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }

/* F3 — "Explain this chart" pill in chart header */
.explain-chart-pill {
  display: inline-flex; align-items: center; gap: 5px;

  background: white;

/* F2 — "Explain this metric" hover button */
.f2-explain-btn {

  font-size: 10px; font-weight: 600;

/* Freshness + source strip (used across mockups) */

// Wire up tooltip interactivity (toggles for accordions + agent)
function wireTooltips() {
  document.querySelectorAll('.compact-tt').forEach(tt => {
    tt.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-toggle');
        const section = tt.querySelector(`[data-section="${target}"]`);
        if (target === 'agent') {
          const isOpen = section.style.display === 'block';
          section.style.display = isOpen ? 'none' : 'block';
        } else {
          section.classList.toggle('open');
          btn.classList.toggle('open');
        }
      });
    });
  });
}

  const displayId = /^f\d/.test(id) ? id.toUpperCase() : id.padStart(2,'0');
  metaId.textContent = displayId;
  if (m.isAi) metaId.classList.add('ai');
  document.getElementById('meta-title').textContent = m.title;
  document.getElementById('meta-tactic').textContent = '· ' + m.tactic;
  document.title = `${displayId} · ${m.title}`;
  document.getElementById('content-root').innerHTML = m.render();
  if (m.afterRender) setTimeout(m.afterRender, 50);
}

const prevLink = document.getElementById('prev-mockup');
const nextLink = document.getElementById('next-mockup');
prevLink.href = idx > 0 ? `mockup.html?id=${order[idx-1]}` : 'index.html';
nextLink.href = idx < order.length-1 ? `mockup.html?id=${order[idx+1]}` : 'index.html';
if (idx === 0) prevLink.style.opacity = .4;
if (idx === order.length-1) nextLink.textContent = 'Done →';
